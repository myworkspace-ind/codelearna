<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Statistics</title>
    <!-- Bootstrap CSS -->
    <link href="/library/webjars/bootstrap/5.2.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-4">Revenue Statistics</h1>

        <!-- Time Period Selection -->
        <div class="mt-4">
            <label for="time-period">Select Time Period:</label>
            <select id="time-period" class="form-control">
                <option value="all">All Time</option>
                <option value="day">Last Day</option>
                <option value="month">Last Month</option>
                <option value="3month">Last 3 Months</option>
                <option value="6month">Last 6 Months</option>
                <option value="year">Last Year</option>
                <option value="custom">Custom Range</option>
            </select>
            <button id="fetch-button" class="btn btn-primary mt-3" onclick="fetchRevenueStatistics()">Fetch Data</button>
        </div>

        <!-- Custom Date Range -->
        <div id="custom-range" class="mt-4" style="display:none;">
            <label for="start-date">Start Date:</label>
            <input type="date" id="start-date" class="form-control">
            <label for="end-date">End Date:</label>
            <input type="date" id="end-date" class="form-control">
        </div>

        <!-- Total Revenue -->
        <h2 class="mt-4">Total Revenue: <span id="total-revenue">Loading...</span></h2>

        <!-- Revenue by Course Table -->
        <h3 class="mt-4">Revenue by Course</h3>
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>Course Name</th>
                    <th>Purchase Count</th>
                    <th>Revenue (VND)</th>
                </tr>
            </thead>
            <tbody id="revenue-data">
                <tr>
                    <td colspan="3" class="text-center">Loading...</td>
                </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
            <!-- Pagination buttons will be added here dynamically -->
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="/library/webjars/jquery/dist/jquery.min.js"></script>
    <script src="/library/webjars/popper.js/2.9.3/umd/popper.min.js"></script>
    <script src="/library/webjars/bootstrap/5.2.0/js/bootstrap.bundle.min.js"></script>

    <script>
        var currentPage = 1;
        var pageSize = 5;
        var totalPages = 1;

        var _ctx = '[[@{/}]]';

        function formatCurrency(amount) {
            if (amount) {
                return new Intl.NumberFormat('vi-VN', {
                    style: 'currency',
                    currency: 'VND',
                    maximumFractionDigits: 0
                }).format(amount);
            }
            return 'N/A';
        }

        function fetchRevenueStatistics() {
            var timePeriod = document.getElementById('time-period').value;
            var startDate = document.getElementById('start-date').value;
            var endDate = document.getElementById('end-date').value;

            var url = `${_ctx}/api/revenue/statistics?page=${currentPage}&size=${pageSize}`;

            if (timePeriod === 'custom' && startDate && endDate) {
                url += `&startDate=${startDate}&endDate=${endDate}`;
            } else {
                url += `&timePeriod=${timePeriod}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const totalRevenue = formatCurrency(data.totalRevenue);
                    document.getElementById('total-revenue').innerText = totalRevenue;

                    const revenueData = data.revenueByCourse;
                    const tbody = document.getElementById('revenue-data');
                    tbody.innerHTML = '';

                    if (revenueData && revenueData.length > 0) {
                        revenueData.forEach(item => {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td>${item.courseName}</td>
                                <td>${item.purchaseCount}</td>
                                <td>${formatCurrency(item.revenue)}</td>
                            `;
                            tbody.appendChild(row);
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="3" class="text-center">No revenue data available</td></tr>`;
                    }

                    totalPages = data.totalPages;
                    updatePagination();
                })
                .catch(error => {
                    console.error('Error fetching revenue statistics:', error);
                });
        }

        function updatePagination() {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            if (currentPage > 1) {
                const prevButton = document.createElement('button');
                prevButton.classList.add('btn', 'btn-primary');
                prevButton.innerText = 'Previous';
                prevButton.onclick = function() {
                    currentPage--;
                    fetchRevenueStatistics();
                };
                paginationContainer.appendChild(prevButton);
            }

            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.classList.add('btn', 'btn-secondary');
                pageButton.innerText = i;
                if (i === currentPage) {
                    pageButton.disabled = true;
                    pageButton.classList.add('active');
                }
                pageButton.onclick = function() {
                    currentPage = i;
                    fetchRevenueStatistics();
                };
                paginationContainer.appendChild(pageButton);
            }

            if (currentPage < totalPages) {
                const nextButton = document.createElement('button');
                nextButton.classList.add('btn', 'btn-primary');
                nextButton.innerText = 'Next';
                nextButton.onclick = function() {
                    currentPage++;
                    fetchRevenueStatistics();
                };
                paginationContainer.appendChild(nextButton);
            }
        }

        document.getElementById('time-period').addEventListener('change', function() {
            var selectedPeriod = this.value;
            var customRangeDiv = document.getElementById('custom-range');
            if (selectedPeriod === 'custom') {
                customRangeDiv.style.display = 'block';
            } else {
                customRangeDiv.style.display = 'none';
            }
        });

        fetchRevenueStatistics();
    </script>
</body>
</html>
