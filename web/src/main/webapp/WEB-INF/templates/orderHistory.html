<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <link rel="stylesheet" href="/library/webjars/bootstrap/5.2.0/css/bootstrap.min.css">
</head>
<body>
	<!-- Navigation Bar fragment -->
    <th:block th:include="fragments/nav"></th:block>
    
    <div class="container mt-3">
        <h2 class="mb-4 text-center">Order History</h2>
        <table id="orderTable" class="table table-bordered table-hover">
            <thead class="table-primary">
                <tr>
                    <th>#</th>
                    <th>Order Code</th>
                    <th>Course Name</th>
                    <th>Payment Method</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order, iterStat : ${orders}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${order.orderCode}"></td>
                    <td th:text="${order.courseId}"></td>
                    <td th:text="${order.paymentMethod}"></td>
					<td th:text="${#numbers.formatDecimal(order.amount, 1, 'DEFAULT', 0, 'DEFAULT')} + ' VNĐ'"></td>
                    <td>
                        <span th:classappend="${order.status.name() == 'COMPLETED'} ? 'text-success fw-bold' : ''" th:text="${order.status.name() == 'COMPLETED' ? 'Completed' : ''}"></span>
                        <span th:classappend="${order.status.name() == 'PENDING'} ? 'text-warning fw-bold' : ''" th:text="${order.status.name() == 'PENDING' ? 'Pending' : ''}"></span>
                        <span th:classappend="${order.status.name() == 'CANCELLED'} ? 'text-danger fw-bold' : ''" th:text="${order.status.name() == 'CANCELLED' ? 'Cancelled' : ''}"></span>
                    </td>
                    <td th:text="${order.createdAt}"></td>
                    <td>
					    <a class="btn btn-sm btn-danger me-2" th:if="${order.status.name() == 'PENDING'}" th:href="@{/orders/cancel/{orderCode}(orderCode=${order.orderCode})}">Cancel</a>
					    <a class="btn btn-sm btn-primary" 
						   th:if="${order.status.name() == 'PENDING'}" 
						   th:href="@{/orders/retry/{orderCode}(orderCode=${order.orderCode}, method=${order.paymentMethod})}">
						   Retry Payment
						</a>
					    <a class="btn btn-sm btn-primary" th:if="${order.status.name() == 'COMPLETED'}" th:href="@{/course/{courseId}(courseId=${order.courseId})}">Go to Course</a>
					</td>
                </tr>
            </tbody>
        </table>
        <div class="d-flex justify-content-between align-items-center mt-4">
  <div class="entries-info">
    Showing <span id="startEntry">0</span> to <span id="endEntry">0</span> of <span id="totalEntries">0</span> entries
  </div>
  <div class="d-flex align-items-center">
    <select id="entriesPerPage" class="form-select form-select-sm me-2" style="width: auto;">
      <option value="10">10</option>
      <option value="25">25</option>
      <option value="50">50</option>
    </select>
    <nav aria-label="Page navigation">
      <ul class="pagination mb-0" id="pagination">
      </ul>
    </nav>
  </div>
</div>
    </div>
    
    <script src="/library/webjars/bootstrap/5.2.0/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/resources/js/library.js}"></script>
    <!-- Determine the root context of the application. -->
	<script th:inline="javascript">
	    var _ctx = /*[[@{/}]]*/ '';
	</script>
	<script src="/library/webjars/jquery/dist/jquery.min.js"></script>
	<script src="/library/webjars/popper.js/2.9.3/umd/popper.min.js"></script>
	<script src="/library/webjars/bootstrap/5.2.0/js/bootstrap.bundle.min.js"></script>
	
	<!-- For Sakai only -->
	<script type="text/javascript" src="/library/js/headscripts.js"></script>
	<script>
document.addEventListener('DOMContentLoaded', function() {
    const table = document.getElementById('orderTable');
    const tbody = table.querySelector('tbody');
    const pagination = document.getElementById('pagination');
    const entriesPerPage = document.getElementById('entriesPerPage');
    const startEntry = document.getElementById('startEntry');
    const endEntry = document.getElementById('endEntry');
    const totalEntries = document.getElementById('totalEntries');
    
    let currentPage = 1;
    let rows = Array.from(tbody.querySelectorAll('tr'));
    let rowsPerPage = parseInt(entriesPerPage.value);
    
    function displayTableRows() {
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const paginatedRows = rows.slice(start, end);
        
        // Clear tbody
        tbody.innerHTML = '';
        
        // Display rows for current page
        paginatedRows.forEach(row => {
            tbody.appendChild(row);
        });
        
        // Update entries info
        startEntry.textContent = rows.length === 0 ? 0 : start + 1;
        endEntry.textContent = Math.min(end, rows.length);
        totalEntries.textContent = rows.length;
        
        // Update pagination
        updatePagination();
    }
    
    function updatePagination() {
        const totalPages = Math.ceil(rows.length / rowsPerPage);
        pagination.innerHTML = '';
        
        // Previous button
        const prevLi = document.createElement('li');
        prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
        prevLi.innerHTML = `<a class="page-link" href="#" aria-label="Previous">
            <span aria-hidden="true">&laquo;</span></a>`;
        prevLi.addEventListener('click', (e) => {
            e.preventDefault();
            if (currentPage > 1) {
                currentPage--;
                displayTableRows();
            }
        });
        pagination.appendChild(prevLi);
        
        // Page numbers
        for (let i = 1; i <= totalPages; i++) {
            const li = document.createElement('li');
            li.className = `page-item ${currentPage === i ? 'active' : ''}`;
            li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
            li.addEventListener('click', (e) => {
                e.preventDefault();
                currentPage = i;
                displayTableRows();
            });
            pagination.appendChild(li);
        }
        
        // Next button
        const nextLi = document.createElement('li');
        nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
        nextLi.innerHTML = `<a class="page-link" href="#" aria-label="Next">
            <span aria-hidden="true">&raquo;</span></a>`;
        nextLi.addEventListener('click', (e) => {
            e.preventDefault();
            if (currentPage < totalPages) {
                currentPage++;
                displayTableRows();
            }
        });
        pagination.appendChild(nextLi);
    }
    
    // Handle entries per page change
    entriesPerPage.addEventListener('change', function() {
        rowsPerPage = parseInt(this.value);
        currentPage = 1;
        displayTableRows();
    });
    
    // Initial display
    displayTableRows();
});
</script>
</body>
</html>
