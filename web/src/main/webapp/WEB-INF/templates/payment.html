<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Payment for Course</h2>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title" th:text="${course.name}"></h5>
                <p class="card-text">Price: <span th:text="${course.discountedPrice}"></span></p>
                <p class="card-text">Your Balance: <span th:text="${balance}"></span></p>
                <form th:action="@{/payment/pay}" method="post">
                    <input type="hidden" name="courseId" th:value="${course.id}"/>
                    <button type="submit" class="btn btn-primary">Pay Now</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
