<html xmlns:th="http://www.thymeleaf.org">
                        <form th:action="@{/voucher/apply}" method="post" id="voucherForm">
                            <input type="hidden" name="courseId" th:value="${course.id}" />
                            <button type="button" class="btn btn-primary mt-3"
                                data-bs-toggle="modal" data-bs-target="#voucherModal">Apply voucher
                            </button>
                        </form>
                        
                        <!-- Voucher Modal -->
                        <div class="modal fade" id="voucherModal" tabindex="-1" aria-labelledby="voucherModalLabel" aria-hidden="true">
                            <div class="modal-dialog modal-lg">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="voucherModalLabel">Chọn Voucher</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <!-- Danh sách Voucher -->
                                        <form id="voucherForm" th:action="@{/voucher/apply}" method="POST">
                                            <input type="hidden" name="courseId" th:value="${course.id}" />
                                            
                                            <div class="voucher-method" onclick="selectVoucher('voucher1')">
                                                <div class="d-flex align-items-center">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" name="voucher" value="voucher1" id="voucher1" required>
                                                    </div>
                                                    <div>
                                                        <label class="form-check-label fw-bold" for="voucher1">Voucher Giảm 10%</label>
                                                        <p class="mb-0 text-muted">Giảm 10% trên tổng giá trị đơn hàng</p>
                                                    </div>
                                                </div>
                                            </div>
                        
                                            <div class="voucher-method mt-3" onclick="selectVoucher('voucher2')">
                                                <div class="d-flex align-items-center">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="radio" name="voucher" value="voucher2" id="voucher2" required>
                                                    </div>
                                                    <div>
                                                        <label class="form-check-label fw-bold" for="voucher2">Voucher Giảm 50K</label>
                                                        <p class="mb-0 text-muted">Giảm 50,000 VNĐ trên tổng đơn hàng</p>
                                                    </div>
                                                </div>
                                            </div>
                        
                                            <div class="mt-4">
                                                <button type="submit" class="btn btn-primary w-100 py-2">Xác nhận Voucher</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
