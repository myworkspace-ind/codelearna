<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>
<head>
<meta charset="UTF-8">
<title>Insert courses with handsontable</title>
<link rel="stylesheet" href="/library/webjars/bootstrap/5.2.0/css/bootstrap.min.css">
</head>
<body>
	<div class="container mt-5">
		<h1 class="mb-4">Add Courses with Handsontable</h1>

		<div id="error-message-handsontable" class="alert alert-danger alert-dismissible fade show" role="alert" style="display: none;">
			<strong>Error!</strong> <span id="error-text"></span>
			<button type="button" class="close" data-dismiss="alert" aria-label="Close">
				<span aria-hidden="true">&times;</span>
			</button>
		</div>

		<input type="file" id="fileInput" class="form-control mb-3" accept=".xls,.xlsx" onchange="handleFileCourse(event)">
		<div id="handsontable-container" class="mb-3"></div>

		<button type="button" class="btn btn-primary" onclick="submitCourseData(event)">Submit Courses</button>
		<button type="button" class="btn btn-secondary" onclick="loadCoursesSection(event)">Cancel</button>

	</div>

</body>


</html>
