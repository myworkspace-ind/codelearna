<div th:fragment="addCourseContent">
	<div class="container mt-5">
		<h1 class="mb-4 fw-bolder">Add New Course</h1>

		<!-- Error Message Display -->
		<div id="error-message-course" class="alert alert-danger alert-dismissible fade show" role="alert" style="display: none;">
			<strong>Error!</strong> <span id="error-text-course"></span>
			<button type="button" class="close" data-dismiss="alert" aria-label="Close">
				<span aria-hidden="true">&times;</span>
			</button>
		</div>

		<!-- Course Form -->
		<form id="courseForm" method="post" enctype="multipart/form-data" class="needs-validation" onsubmit="submitCourseForm(event)" novalidate>
			<!-- Course Name Input -->
			<div class="mb-3">
				<label for="name" class="form-label">Course Name <span style="color:red">*</span></label>
				<input type="text" class="form-control" id="name" name="name" required>
				<div class="invalid-feedback">Please provide a course name.</div>
			</div>

			<div class="row">
				<div class="col-md-6 mb-3">
					<label for="originalPrice" class="form-label">Original Price <span style="color:red">*</span></label>
					<input type="number" class="form-control" id="originalPrice" name="originalPrice" required step="1" min="0">
					<div class="invalid-feedback">Original price must be 0 or greater.</div>
				</div>
				<div class="col-md-6 mb-3">
					<label for="discountedPrice" class="form-label">Discounted Price <span style="color:red">*</span></label>
					<input type="number" class="form-control" id="discountedPrice" name="discountedPrice" required step="1" min="0">
					<div class="invalid-feedback">Discounted price must be 0 or greater.</div>
				</div>
			</div>

			<!-- Image URL Input -->
			<div class="mb-3">
				<label for="imageUrl" class="form-label">Image URL</label>
				<input type="text" class="form-control" id="imageUrl" name="imageUrl" placeholder="Enter image URL" required>
				<div class="invalid-feedback">Please enter an image URL.</div>
			</div>

			<!-- Description Input -->
			<div class="mb-3">
				<label for="description" class="form-label">Description</label>
				<textarea class="form-control" id="description" name="description" rows="3"></textarea>
			</div>

			<div class="row">
				<div class="col-md-6 mb-3">
					<label for="difficultyLevel" class="form-label">Difficulty Level <span style="color:red">*</span></label>
					<select class="form-select" id="difficultyLevel" name="difficultyLevel.id" required>
						<option value="">Choose difficulty level...</option>
						<option th:each="difficultyLevel : ${difficultyLevels}" th:value="${difficultyLevel.Id}" th:text="${difficultyLevel.paramValue}"></option>
					</select>
				</div>
				<div class="col-md-6 mb-3">
					<label for="lessonType" class="form-label">Lesson Type <span style="color:red">*</span></label>
					<select class="form-select" id="lessonType" name="lessonType.id" required>
						<option value="">Choose lesson type...</option>
						<option th:each="lessonType : ${lessonTypes}" th:value="${lessonType.id}" th:text="${lessonType.paramValue}"></option>
					</select>
				</div>
			</div>

			<!-- Category and Subcategory Inputs -->
			<div class="mb-3">
				<label for="category" class="form-label">Category <span style="color:red">*</span></label>
				<select class="form-select" id="category" onchange="filterSubcategories(this.value, this.options[this.selectedIndex].dataset.paramId)" required>
					<option value="">Choose a category...</option>
					<option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.parameter.paramValue}" th:data-param-id="${category.parameter.id}"></option>
				</select>
			</div>

			<div class="mb-3">
				<label for="subcategory" class="form-label">Subcategory <span style="color:red">*</span></label>
				<select class="form-select" id="subcategory" name="subcategory.id" disabled required>
					<option value="">Choose a subcategory...</option>
					<option th:each="subcategory : ${subcategories}" th:value="${subcategory.id}" th:data-category-id="${subcategory.category.id}" th:text="${subcategory.parameter.paramValue}"></option>
				</select>
			</div>

			<!-- Free Course Checkbox -->
			<div class="mb-3 form-check">
				<input type="checkbox" class="form-check-input" id="isFree" name="isFree">
				<label class="form-check-label" for="isFree">Is Free Course</label>
			</div>

			<!-- Submit and Cancel Buttons -->
			<button type="submit" class="btn btn-primary">Add Course</button>
			<button type="button" class="btn btn-secondary" onclick="loadCoursesSection(event)">Cancel</button>
		</form>
	</div>
</div>
