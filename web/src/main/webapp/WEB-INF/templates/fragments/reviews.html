<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Fragment - Reviews</title>
<link rel="stylesheet" href="/library/webjars/bootstrap/5.2.0/css/bootstrap.min.css">
</head>

<body>
	<div th:fragment="reviews">

		<div class="reviews-section mt-5">
			<div class="d-flex justify-content-between align-items-center mb-3">
				<h4>Learner Reviews</h4>
				<div class="filter-reviews">
					<select id="reviewSortSelect" class="form-select form-select-sm w-auto" onchange="applySorting()">
						<option value="">Sort Reviews</option>
						<option value="rating-desc" th:selected="${selectedSort == 'rating-desc'}">Highest Rating</option>
						<option value="rating-asc" th:selected="${selectedSort == 'rating-asc'}">Lowest Rating</option>
						<option value="date-desc" th:selected="${selectedSort == 'date-desc'}">Most Recent</option>
						<option value="date-asc" th:selected="${selectedSort == 'date-asc'}">Oldest First</option>
					</select>
				</div>
			</div>

			<p class="text-muted mb-3">
				Average Rating: <strong th:text="${course.averageRating ?: 0}"></strong> stars
			</p>

			<!-- Reviews List -->
			<ul class="list-group mb-4">
				<li class="review-item list-group-item" th:attr="data-date=${review.createdAt}" th:each="review : ${reviews}">
					<div class="review-header d-flex align-items-center gap-3 mb-3">
						<img th:src="'https://static.vecteezy.com/system/resources/thumbnails/000/439/863/small/Basic_Ui__28186_29.jpg'" class="rounded-circle"
							alt="User Avatar" width="50" height="50">
						<div>
							<h6 class="mb-0" th:text="${review.userEid ?: 'Anonymous'}">User Name</h6>
							<small class="text-muted" th:text="'By: ' + (${review.userEid ?: 'Anonymous'})"></small>
						</div>
						<div class="ms-auto">
							<div class="rating-stars-review">
								<span th:each="i : ${#numbers.sequence(1, 5)}"> <span th:class="${i <= review.ratingStar ? '' : 'empty-star'}"
									th:text="${i <= review.ratingStar ? '★' : '☆'}"></span></span>
							</div>
						</div>
					</div>
					<div class="review-body">
						<p class="mb-2" th:text="${review.content}">This is a sample review content.</p>

						<div th:if="${review.userEid} == ${userEid}" class="d-flex gap-2">
							<!-- Delete Button -->
							<button type="button" class="btn btn-danger btn-sm delete-review-btn" th:data-review-id="${review.id}" th:data-course-id="${course.id}">Delete</button>
							<button type="button" class="btn btn-warning btn-sm" th:data-review-id="${review.id}" th:data-course-id="${course.id}"
								th:onclick="'loadEditReviewForm(' + ${review.id} + ',' + ${course.id} + ')'">Edit</button>
						</div>
					</div>
				</li>
			</ul>

			<!-- Pagination -->
			<nav aria-label="Page navigation" th:if="${totalPages > 1}">
				<ul class="pagination justify-content-center">
					<!-- Nút Previous -->
					<li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'"><a class="page-link"
						th:href="@{/course/{id}(id=${course.id}, page=${currentPage - 1})}">Previous</a></li>

					<!-- Các trang -->
					<li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'"><a
						class="page-link" th:text="${i + 1}" th:href="@{/course/{id}(id=${course.id}, page=${i})}"></a></li>

					<!-- Nút Next -->
					<li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"><a class="page-link"
						th:href="@{/course/{id}(id=${course.id}, page=${currentPage + 1})}">Next</a></li>
				</ul>
			</nav>

			<input type="hidden" name="courseId" th:value="${course.id}"> <input type="hidden" name="currentPage" th:value="${currentPage}">
		</div>

	</div>
	
</body>

</html>
