<div th:fragment="lessonsContent">
	<div class="container-fluid mt-5">
		<h1 class="mb-4 fw-bolder">Lessons for Course</h1>

		<!-- Add Lesson buttons -->
		<div class="d-flex justify-content-end mb-3">
			<button type="button" class="btn btn-success btn-sm me-2"
				th:onclick="'loadAddLessonForm(' + ${course.id} + ')'">Add
				Lesson</button>
			<button type="button" class="btn btn-success btn-sm"
				th:onclick="'fetchAddLessonHandsontablePage(event, ' + ${course.id} + ')'">
				Add Lessons with Handsontable</button>
		</div>
		<div id="lessonsContainer">
			<div class="table-responsive">
				<table class="table table-bordered table-hover">
					<thead class="thead-dark">
						<tr>
							<th style="width: 5%;">#</th>
							<th style="width: 25%;">Lesson Title</th>
							<th style="width: 35%;">Video URL</th>
							<th style="width: 15%;">Created Date</th>
							<th style="width: 20%;">Action</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="lesson, iterStat : ${lessons}">
							<th th:text="${iterStat.count}"></th>
							<td th:text="${lesson.title}"></td>
							<td><a th:href="${lesson.videoUrl}" target="_blank"
								th:text="${lesson.videoUrl}"></a></td>
							<td
								th:text="${#dates.format(lesson.createdDate, 'dd-MM-yyyy HH:mm')}"></td>
							<td>
								<div class="btn-group" role="group">
									<button type="button" class="btn btn-warning btn-sm"
										th:onclick="'loadEditLessonForm(' + ${lesson.id} + ')'">Edit</button>
									<button type="button" class="btn btn-danger btn-sm"
										th:onclick="'showLessonDeleteConfirmModal(' + ${lesson.id} + ',' + ${course.id} + ')'">Delete</button>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<div class="modal fade" id="deleteConfirmModal" tabindex="-1"
			aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="deleteConfirmModalLabel">Confirm
							Delete</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"
							aria-label="Close"></button>
					</div>
					<div class="modal-body">Are you sure you want to delete this
						lesson? This action cannot be undone.</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">Cancel</button>
						<button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
					</div>
				</div>
			</div>
		</div>
		<nav>
			<ul class="pagination justify-content-center" id="lessonsPagination"></ul>
		</nav>
	</div>
</div>
