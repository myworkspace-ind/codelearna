<div th:fragment="campaignsContent">
    <div class="container mt-5">
        <h1 class="mb-4">Campaign Management</h1>

        <!-- Add Campaign Button -->
        <div class="d-flex justify-content-end mb-3">
            <button type="button" class="btn btn-success mx-3" onclick="fetchAddCampaignPage(event)">Add Campaign</button>
            <!-- <a class="btn btn-primary" href="#" th:onclick="'fetchAddCampaignHandsontablePage(event)'">Add Campaigns with Handsontable</a> -->
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3"
			style="width: 300px;">
			<input type="text" id="campaignSearchInput" class="form-control"
				placeholder="Search campaign name..." aria-label="Search campaign name"
				onkeypress="handleSearchCampaignKeyPress(event)">
			<button class="btn btn-outline-secondary ms-2" type="button"
				onclick="searchCampaigns()">Search</button>
		</div>
        
        <div id="campaignsContainer">
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="thead-dark text-dark">
                        <tr>
                            <th>#</th>
                            <th>Image</th>
                            <th>Campaign Name</th>
                            <th>Description</th>
                            <th>Start Time</th>
                            <th>End Time</th>
                            <th>Short Description</th>
                            <th>status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody class="text-dark">
                        <tr th:each="campaign, iterStat : ${campaigns}">
                            <th th:text="${iterStat.count}"></th>
                            <td><img th:src="${campaign.coverImageUrl}" alt="campaign image" style="max-width: 100px;" /></td>
                            <td th:text="${campaign.name}"></td>
                            <td th:text="${campaign.description}"></td>
                            <td th:text="${#dates.format(campaign.startTime, 'yyyy-MM-dd')}"></td>
                            <td th:text="${#dates.format(campaign.endTime, 'yyyy-MM-dd')}"></td>
                            <td th:text="${campaign.shortDescription}"></td>
                            <td th:text="${campaign.status}"></td>
                            <td>
                                <div class="btn-group" role="group">
                                    <a href="#" class="btn btn-primary btn-sm" th:attr="onclick='addVoucherById(' + ${campaign.id} + '); return false;'">Add voucher</a>
                                    <a href="#" class="btn btn-warning btn-sm" th:attr="onclick='loadEditCampaignForm(' + ${campaign.id} + '); return false;'">Edit</a>
                                    <button type="button" class="btn btn-sm"
                                        th:class="${campaign.status == 'ACTIVE' ? 'btn-secondary' : 'btn-success'}"
                                        th:data-campaign-id="${campaign.id}"
                                        th:data-status="${campaign.status}"
                                        th:onclick="'showCampaignStatusChangeModal(this.dataset.campaignId, this.dataset.status)'"
                                        th:text="${campaign.status == 'ACTIVE' ? 'Deactivate' : 'Activate'}"
                                        th:disabled="${campaign.status == 'DELETED'}"></button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Modal for Status Change Confirmation -->
        <div class="modal fade" id="statusChangeModal" tabindex="-1" aria-labelledby="statusChangeModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="statusChangeModalLabel">Confirm Status Change</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">Are you sure you want to change the status of this campaign? This action will update its current status.</div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger" id="confirmStatusChangeBtn">Change Status</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Pagination -->
        <nav>
            <ul class="pagination justify-content-center" id="campaignsPagination"></ul>
        </nav>
    </div>
</div>
