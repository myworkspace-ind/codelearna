<div th:fragment="campaignsContent">
    <div class="container mt-5">
        <h1 class="mb-4">Campaign Management</h1>

        <!-- Add Campaign Button -->
        <div class="d-flex justify-content-end mb-3">
            <button type="button" class="btn btn-success mx-3" onclick="fetchAddCampaignPage(event)">Add Campaign</button>
            <a class="btn btn-primary" href="#" th:onclick="'fetchAddCampaignHandsontablePage(event)'">Add Campaigns with Handsontable</a>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3"
			style="width: 300px;">
			<input type="text" id="campaignSearchInput" class="form-control"
				placeholder="Search campaign name..." aria-label="Search campaign name"
				onkeypress="handleSearchCampaignKeyPress(event)">
			<button class="btn btn-outline-secondary ms-2" type="button"
				onclick="searchCampaigns()">Search</button>
		</div>
        
        <div id="campaignsContainer">
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="thead-dark text-dark">
                        <tr>
                            <th>#</th>
                            <th>Image</th>
                            <th>Campaign Name</th>
                            <th>Description</th>
                            <th>Start Time</th>
                            <th>End Time</th>
                            <th>Short Description</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody class="text-dark">
                        <tr th:each="campaign, iterStat : ${campaigns}">
                            <th th:text="${iterStat.count}"></th>
                            <td><img th:src="${campaign.coverImageUrl}" alt="campaign image" style="max-width: 100px;" /></td>
                            <td th:text="${campaign.name}"></td>
                            <td th:text="${campaign.description}"></td>
                            <td th:text="${#dates.format(campaign.startTime, 'yyyy-MM-dd')}"></td>
                            <td th:text="${#dates.format(campaign.endTime, 'yyyy-MM-dd')}"></td>
                            <td th:text="${campaign.shortDescription}"></td>
                            <td>
                                <div class="btn-group" role="group">
                                    <a href="#" class="btn btn-primary btn-sm" th:attr="onclick='addVoucherById(' + ${campaign.id} + '); return false;'">Add voucher</a>
                                    <a href="#" class="btn btn-warning btn-sm" th:attr="onclick='loadEditCampaignForm(' + ${campaign.id} + '); return false;'">Edit</a>
                                    <!-- <a href="#" class="btn btn-danger btn-sm" th:onclick="showDeleteConfirmModal([[${campaign.id}]])" title="Delete Campaign">Delete</a> -->
                                    <a href="#" class="btn btn-danger btn-sm" th:onclick="showDeleteConfirmModal_campaign([[${campaign.id}]])" title="Delete Campaign">Delete</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Modal for Delete Confirmation -->
        <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title" id="deleteConfirmModalLabel">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i> Confirm Delete
                        </h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>Are you sure you want to delete this campaign? This action cannot be undone.</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Pagination -->
        <nav>
            <ul class="pagination justify-content-center" id="campaignsPagination"></ul>
        </nav>
    </div>
</div>
