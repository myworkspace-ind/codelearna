<html xmlns:th="http://www.thymeleaf.org">

<!-- <body> -->
	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container-fluid">
			<a class="navbar-brand ml-5" th:href="@{/}"> <img th:src="${logoUrl}" alt="Site Logo" class="navbar-logo">
			</a>

			<!-- Toggle button for mobile -->
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
            <!-- Hide for staging -->
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav mx-auto mb-2 mb-lg-0">
					<li class="nav-item dropdown" style="display: none">
						<button class="btn btn-outline-primary dropdown-toggle" data-bs-auto-close="outside" type="button" id="categoriesDropdown"
							data-bs-toggle="dropdown" aria-expanded="false">Categories</button>
						<ul class="dropdown-menu" aria-labelledby="categoriesDropdown">
							<li class="dropdown-submenu" th:each="category : ${categories}"><a class="dropdown-item dropdown-toggle" data-bs-toggle="dropdown"
								href="#" th:text="${category.parameter.paramValue}"></a>
								<ul class="dropdown-menu">
									<li th:each="subcategory : ${category.subcategories}"><a class="dropdown-item" th:href="@{/subcategory/{id}(id=${subcategory.id})}"
										th:text="${subcategory.parameter.paramValue}"></a></li>
								</ul></li>
						</ul>
					</li>
				</ul>

				<!-- Search Form -->
				<form th:action="@{/search}" method="get" class="d-flex search-form">
					<input type="text" name="keyword" class="form-control" placeholder="Find the course you want">
					<button type="submit" class="btn btn-outline-primary ms-2">Search</button>
				</form>

                <!-- Anonymous -->
                <div th:unless="${#httpServletRequest.remoteUser}">
                    <a th:href="${session.loginUrl}" class="btn btn-primary" title="Authentication with CAS.">Login</a>
<!--                     <a th:href="@{/register}" class="btn btn-secondary">Đăng ký</a> -->
                </div>
        
                <!-- Authenticated -->
                <ul class="navbar-nav ms-auto" th:if="${#request.userPrincipal != null}">
                    <li class="nav-item mx-3"><a class="nav-link" th:href="@{/library}">My Courses</a></li>
                    <li class="nav-item dropdown ms-3">
                        <button 
                            class="btn btn-outline-secondary dropdown-toggle" 
                            type="button" 
                            id="userMenuButton" 
                            data-bs-toggle="dropdown" 
                            aria-expanded="false"
                            th:text="${session.userEid}">
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="userMenuButton">
                            <li>
                                <a class="dropdown-item" th:href="@{/admin}">Dashboard</a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/orders/myorders}">My Orders</a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item" th:href="@{/logout}">Logout</a>
                            </li>
                        </ul>
                    </li>
                </ul>
			</div>
		</div>
	</nav>
