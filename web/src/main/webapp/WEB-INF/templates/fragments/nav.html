<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" th:href="@{/resources/css/fragments/nav.css}">
<link rel="stylesheet"
	href="https://mksol.vn/themes/robust-admin/app-assets/fonts/font-awesome/css/font-awesome.min.css">
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
/* Add this to your nav.css file */
.dropdown-menu {
	max-height: 80vh; /* 80% of viewport height */
	overflow-y: auto; /* Enable vertical scrolling */
}

/* Optional: Style the scrollbar */
.dropdown-menu::-webkit-scrollbar {
	width: 6px;
}

.dropdown-menu::-webkit-scrollbar-track {
	background: #f1f1f1;
}

.dropdown-menu::-webkit-scrollbar-thumb {
	background: #888;
	border-radius: 3px;
}

/* Ensure dropdown is positioned correctly */
.nav-item.dropdown {
	position: static;
}

/* Position the dropdown relative to its parent */
@media ( min-width : 992px) {
	.nav-item.dropdown {
		position: relative;
	}
	.dropdown-menu {
		right: 0;
		left: auto;
	}
}
</style>
</head>

<body>
	<nav class="navbar navbar-expand-lg navbar-light bg-light">
		<div class="container-fluid">
			<a class="navbar-brand ml-5" th:href="@{/}"> <img
				th:src="${logoUrl}" alt="Site Logo" class="navbar-logo">
			</a>

			<!-- Toggle button for mobile -->
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav mx-auto mb-2 mb-lg-0">
					<li class="nav-item dropdown">
						<button class="btn btn-outline-primary dropdown-toggle"
							data-bs-auto-close="outside" type="button"
							id="categoriesDropdown" data-bs-toggle="dropdown"
							aria-expanded="false">Categories</button>
						<ul class="dropdown-menu" aria-labelledby="categoriesDropdown">
							<li class="dropdown-submenu" th:each="category : ${categories}"><a
								class="dropdown-item dropdown-toggle" data-bs-toggle="dropdown"
								href="#" th:text="${category.parameter.paramValue}"></a>
								<ul class="dropdown-menu">
									<li th:each="subcategory : ${category.subcategories}"><a
										class="dropdown-item"
										th:href="@{/subcategory/{id}(id=${subcategory.id})}"
										th:text="${subcategory.parameter.paramValue}"></a></li>
								</ul></li>
						</ul>
					</li>
				</ul>

				<!-- Search Form -->
				<form th:action="@{/search}" method="get" class="d-flex search-form">
					<input type="text" name="keyword" class="form-control"
						placeholder="Find the course you want">
					<button type="submit" class="btn btn-outline-primary ms-2">Search</button>
				</form>

				<ul class="navbar-nav ms-auto">
					<li class="nav-item mx-3"><a class="nav-link"
						th:href="@{/library}">My Courses</a></li>
					<!-- <li class="nav-item mx-2">
						<span class="nav-link">Balance: <span th:text="${#numbers.formatDecimal(session.userBalance, 2, 'DEFAULT', 0, 'DEFAULT')}"></span></span>
					</li> -->
					<li class="nav-item dropdown ms-3">
						<button class="btn btn-outline-secondary dropdown-toggle"
							type="button" id="userMenuButton" data-bs-toggle="dropdown"
							aria-expanded="false" th:text="${session.userDisplayName}">
						</button>
						<ul class="dropdown-menu" aria-labelledby="userMenuButton">
							<!-- Chỉ hiện Dashboard nếu là Admin -->
							<li th:if="${session.userDisplayName == 'Admin'}"><a
								class="dropdown-item" th:href="@{/admin}">Dashboard</a></li>
							<li><a class="dropdown-item" th:href="@{/orders/myorders}">My
									Orders</a></li>
						</ul>
					</li>
				</ul>
			</div>
		</div>
	</nav>
</body>
</html>
