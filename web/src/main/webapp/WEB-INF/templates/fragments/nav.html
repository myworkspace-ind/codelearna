<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/resources/css/fragments/nav.css}">
    <link rel="stylesheet" href="https://mksol.vn/themes/robust-admin/app-assets/fonts/font-awesome/css/font-awesome.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="${logoUrl}" alt="Site Logo" class="navbar-logo">
            </a>

            <!-- Toggle button for mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ml-5">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="categoriesDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Categories
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="categoriesDropdown">
                            <li class="dropdown-submenu" th:each="category : ${categories}">
                                <a class="dropdown-item dropdown-toggle" data-bs-toggle="dropdown"
                                    href="#" th:text="${category.parameter.paramValue}"></a>
                                <ul class="dropdown-menu">
                                    <li th:each="subcategory : ${category.subcategories}">
                                        <a class="dropdown-item"
                                            th:href="@{/subcategory/{id}(id=${subcategory.id})}"
                                            th:text="${subcategory.parameter.paramValue}"></a>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </li>
                </ul>

                <!-- Search Form -->
                <form th:action="@{/search}" method="get" class="d-flex search-form">
                    <input type="text" name="keyword" class="form-control" placeholder="Find the course you want">
                    <button type="submit" class="btn btn-outline-primary ms-2">Search</button>
                </form>

  
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item mx-2">
                        <a class="nav-link">My Cart</a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link" th:href="@{/library}">My Courses</a>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-secondary" th:text="${session.userDisplayName}"></button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <th:block th:include="fragments/javascript.html"></th:block>
</body>
</html>
