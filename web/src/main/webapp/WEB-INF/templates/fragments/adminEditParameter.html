<div th:fragment="editParameterModal">
	<div class="modal fade" id="editParameterModal" tabindex="-1" aria-labelledby="editParameterModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="editParameterModalLabel">Edit Parameter</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<form id="editParameterForm" th:action="@{/admin/parameter/edit/{id}(id=${parameter.id})}" method="post" enctype="multipart/form-data"
						th:object="${parameter}">

						<div class="mb-3">
							<label for="paramKey" class="form-label">Parameter Key</label> <input type="text" class="form-control" id="paramKey" th:field="*{paramKey}"
								readonly>
						</div>


						<div class="mb-3">
							<label for="paramValue" class="form-label">Parameter Value</label> <input type="text" class="form-control" id="paramValue"
								th:field="*{paramValue}" required>
						</div>

					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
					<button type="submit" form="editParameterForm" class="btn btn-primary">Save changes</button>
				</div>
			</div>
		</div>
	</div>
</div>
