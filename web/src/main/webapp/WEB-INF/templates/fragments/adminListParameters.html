<div th:fragment="parametersContent">
	<div class="container mt-5">
		<h1 class="mb-4">Parameters Manage</h1>




		<!--Thêm mới filter  -->
		<label for="filterKey" class="form-label">Filter by Parameter Key:</label>
		<div class="filter-container mb-3">
		    <div>
			    <label for="filterKey" class="form-label">Parameter:</label>
			    <select id="filterKey" class="form-select">
			        <option value="">All</option>
			        <option value="site_logo">site_logo</option>
			        <option value="difficulty_level">difficulty_level</option>
			        <option value="lesson_type">lesson_type</option>
			        <!-- <tr th:each="parameter : ${parameters}">
				    	<option th:value="${parameter.paramKey}" th:text="${parameter.paramKey}"></option>
				    </tr> -->
			    </select>
		    </div>
		    
		    <div>
		    	<label for="filterValue" class="form-label">Parameter Value: </label>
			    <select id="filterValue" class="form-select">
				    <option value="">All</option>
				    <tr th:each="parameter : ${parameters}">
				    	<option th:value="${parameter.paramValue}" th:text="${parameter.paramValue}"></option>
				    </tr>
				</select>
		    </div>
		    
		    <div>
		    	<label for="filterKey" class="form-label">Project: </label>
			    <select id="filterProject" class="form-select">
				    <option value="">All</option>
			        <option value="">LearnA</option>
			        <option value="">CRM</option>
			        <option value="">AIMedia</option>
			        <option value="">CVHub</option>
			        <option value="">xTOEIC</option>
				</select>
		    </div>
		   
		</div>
		<!--Thêm mới filter  -->
		<!-- Add Parameters Button -->
		<div class="d-flex justify-content-end mb-3">
			<a class="btn btn-success" href="#"
				th:onclick="'fetchAddParamValueHandsontablePage(event)'">Add
				Parameters with Handsontable</a>
		</div>
		
		
		
		<div id="parametersContainer">
			<div class="table-responsive">
				<table class="table table-bordered table-hover">
					<thead class="thead-dark">
						<tr>
							<th>#</th>
							<th>Parameter Key</th>
							<th>Parameter Value</th>
							<th>Action</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="parameter, iterStat : ${parameters}">
							<th th:text="${iterStat.count}"></th>
							<td th:text="${parameter.paramKey}"></td>
							<td th:text="${parameter.paramValue}"></td>
							<td>
								<div class="btn-group" role="group">
									<a href="#" class="btn btn-warning btn-sm"
										th:attr="onclick='loadEditParameterForm(' + ${parameter.id} + '); return false;'">Edit</a>
									<a href="#" class="btn btn-danger btn-sm"
										th:onclick="showDeleteParameterConfirmModal([[${parameter.id}]])">Delete</a>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<div class="modal fade" id="deleteConfirmModal" tabindex="-1"
			aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header bg-danger text-white">
						<h5 class="modal-title" id="deleteConfirmModalLabel">
							<i class="bi bi-exclamation-triangle-fill me-2"></i> Confirm
							Delete
						</h5>
						<button type="button" class="btn-close btn-close-white"
							data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<p>Are you sure you want to delete this parameter? This action
							cannot be undone.</p>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary"
							data-bs-dismiss="modal">Cancel</button>
						<button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
					</div>
				</div>
			</div>
		</div>
		<!-- Pagination -->
		<nav>
			<ul class="pagination justify-content-center"
				id="parametersPagination"></ul>
		</nav>
	</div>
</div>
