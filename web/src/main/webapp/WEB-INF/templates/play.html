<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Page</title>
    <th:block th:include="fragments/head"></th:block>
    <link rel="stylesheet" th:href="@{/resources/css/play.css}">

</head>
<body>
	<th:block th:include="fragments/nav"></th:block>
	<div id="userEid" th:data-user-eid="${userEId}" style="display: none;"></div>
	<div id="userEmail" th:data-user-email="${userEmail}"
		style="display: none;"></div>
	<div class="container-play">
		<button id="toggle-btn">☰</button>

		<div class="main-video" id="main-video">
			<div class="video">
				<div id="course">
					<iframe id="embedded-content" width="100%" height="900px" frameborder="0" allowfullscreen> </iframe>
				</div>
				<h3 class="title"
					th:text="${currentLesson != null && currentLesson.title != null ? currentLesson.title : 'No lesson available'}">
					Lesson title</h3>
			</div>

			<div class="controls">
				<button id="prev-btn">Previous Lesson</button>
				<button id="next-btn">Next Lesson</button>

			</div>
		</div>

		<!-- Video list -->
		<div class="video-list" id="video-list">
			<div class="video-list-content">
				<!-- Lesson search box -->
				<div class="search-container">
					<input type="text" placeholder="Tìm kiếm bài học..." id="search"
						onkeyup="searchLessons(this.value)"> <span
						class="search-icon">&#128269;</span>
					<!-- Icon tìm kiếm -->
				</div>

				<div th:each="lesson, lessonStat : ${lessons}" class="vid"
					th:classappend="${lessonStat.first} ? 'active'"
					th:attr="data-lesson-id=${lesson.id}, 
              data-course-id=${lesson.course != null ? lesson.course.id : 0}, 
              data-activity-id=${lesson.activityId}">
					<video th:src="${lesson.videoUrl}" muted></video>
					<h3 class="title" th:text="${lesson.title}">Lesson</h3>
				</div>

			</div>
		</div>

		<!-- Comment section -->
		<div class="comment-section">
			<h3>Comments</h3>
			<div class="comment-input">
				<textarea id="comment-text" placeholder="Enter your comment..."
					rows="3"></textarea>
				<button id="submit-comment-btn">Submit Comment</button>
			</div>
			<!-- Comment list fragment -->
			<div th:replace="fragments/commentList"></div>
		</div>
	</div>


	<script th:src="@{/resources/js/play.js}"></script>
	<th:block th:include="fragments/javascript.html"></th:block>
</body>
</html>
