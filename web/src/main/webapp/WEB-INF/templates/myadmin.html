<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>MyAdmin</title>
    <th:block th:include="fragments/head"></th:block>
</head>
<body>
    <th:block th:include="fragments/hnav"></th:block>
    
    <div th:switch="${session.currentMenu}">

        <div th:case="'Settings'">
            <div th:replace="~{fragments/myadmin/settings :: settings_form}"></div>
        </div>
        <div th:case="'CurrentUsers'">
            <div th:replace="~{fragments/myadmin/current_users :: current_user_form}"></div>
        </div>
        <div th:case="'Parameters'">
            <div th:replace="~{fragments/adminListParameters :: parametersContent}"></div>
        </div>  
        <div th:case="'Courses'">
            <div th:replace="~{fragments/adminListCourse :: coursesContent}"></div>
        </div>
        <p th:case="*">Please contact Administrator to check session attribute "currentMenu"</p>
    </div>
    
    <th:block th:include="fragments/about_dialog"></th:block>
   	<script th:src="@{/resources/js/adminParameters.js}"></script>
</body>
</html>
