<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch qua Proxy</title>
</head>
<body>
    <h1>Dữ liệu bảng</h1>
    <div id="table-data"></div>

    <script>
        // Proxy URL
        const proxy = 'https://cors-anywhere.herokuapp.com/';
        const url = 'https://mksol.vn/xapi-lrs/DuyHN/course';

        // Fetch qua Proxy
        fetch(proxy + url)
            .then(response => response.text())
            .then(html => {
                // Tạo DOM ảo
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Lấy bảng
                const table = doc.querySelector('table');
                if (table) {
                    document.getElementById('table-data').innerHTML = table.outerHTML;
                } else {
                    document.getElementById('table-data').textContent = 'Không tìm thấy bảng!';
                }
            })
            .catch(error => {
                console.error('Lỗi proxy:', error);
                document.getElementById('table-data').textContent = 'Lỗi khi lấy dữ liệu!';
            });
    </script>
</body>
</html>
