<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết khóa học</title>
<link rel="stylesheet"
	href="/library/webjars/bootstrap/5.2.0/css/bootstrap.min.css">
<link rel="stylesheet"
	th:href="@{/resources/css/fragments/courseDetail.css}">
<link rel="stylesheet" th:href="@{/resources/css/fragments/review.css}">
</head>

<body>
	<th:block th:include="fragments/nav"></th:block>

	<div class="container mt-5">
		<!-- Course Header -->
		<div class="course-header">
			<h2 th:text="${course.name}">Tên khóa học</h2>
		</div>

		<!-- Course Body -->
		<div class="course-body row mt-4">
			<div class="col-md-8">
				<!-- Course Image -->
				<div class="course-image mb-4">
					<img th:src="@{${course.imageUrl}}" alt="Course Image">
				</div>
			</div>

			<div class="col-md-4">
				<!-- Course Description -->
				<div class="course-description">
					<h4>About this course</h4>
					<p th:text="${course.description}">Đây là mô tả khóa học.</p>
				</div>

				<!-- Course Details -->
				<div class="course-details mt-4">
					<h4>Overview</h4>
					<p>
						Level Requirement: <span
							th:text="${course.difficultyLevel.paramValue}">BEGINNER</span>
					</p>
					<p>
						Lesson type: <span th:text="${course.lessonType.paramValue}">Video</span>
					</p>

					<p
						th:text="'₫ ' + ${#numbers.formatDecimal(course.originalPrice, 1, 'DEFAULT', 0, 'DEFAULT')}"
						style="text-decoration: line-through;"></p>
					<h5 class="text-danger"
						th:text="'₫ ' + ${#numbers.formatDecimal(course.discountedPrice, 1, 'DEFAULT', 0, 'DEFAULT')}"></h5>

					<!-- Form để gửi yêu cầu thanh toán -->
					<form th:action="@{/payment/pay}" method="post" id="paymentForm">
						<input type="hidden" name="courseId" th:value="${course.id}" />
						<button type="button" class="btn btn-primary mt-3"
							data-bs-toggle="modal" data-bs-target="#confirmModal">Buy
							now</button>
					</form>

					<!-- Modal xác nhận thanh toán -->
					<div class="modal fade" id="confirmModal" tabindex="-1"
						aria-labelledby="confirmModalLabel" aria-hidden="true">
						<div class="modal-dialog">
							<div class="modal-content">
								<div class="modal-header">
									<h5 class="modal-title" id="confirmModalLabel">Confirm
										Payment</h5>
									<button type="button" class="btn-close" data-bs-dismiss="modal"
										aria-label="Close"></button>
								</div>
								<div class="modal-body">Are you sure you want to proceed
									with the payment for this course?</div>
								<div class="modal-footer">
									<button type="button" class="btn btn-secondary"
										data-bs-dismiss="modal">Cancel</button>
									<!-- Nút xác nhận sẽ gọi một hàm JavaScript để gửi form -->
									<button type="button" class="btn btn-primary"
										id="confirmPaymentBtn">Confirm</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div th:include="fragments/reviews :: reviews"></div>

	</div>

	<th:block th:include="fragments/javascript"></th:block>
	<script>
	    // JavaScript để xử lý việc gửi form khi người dùng nhấn "Confirm"
	    document.getElementById('confirmPaymentBtn').addEventListener('click', function() {
	        // Gửi form khi nhấn "Confirm"
	        document.getElementById('paymentForm').submit();
	    });
	</script>
</body>

</html>
